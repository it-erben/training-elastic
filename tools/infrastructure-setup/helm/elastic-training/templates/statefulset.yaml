apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "elastic-training.fullname" . }}
  labels:
    {{- include "elastic-training.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "elastic-training.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      {{- include "elastic-training.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "elastic-training.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
          securityContext:
            privileged: true
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /usr/share/elasticsearch/data"]
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      containers:
        - name: elasticsearch
          image: "{{ .Values.elasticsearch.image }}:{{ .Values.elasticsearch.tag }}"
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms{{ .Values.elasticsearch.heapSize }} -Xmx{{ .Values.elasticsearch.heapSize }}"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "elastic-training.fullname" . }}
                  key: elastic-password
            - name: cluster.name
              value: training-cluster
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "curl -sf -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health?local=true"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 256m
              memory: 1Gi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
        - name: kibana
          image: "{{ .Values.kibana.image }}:{{ .Values.kibana.tag }}"
          command:
            - bash
            - -c
            - |
              ORDINAL=${HOSTNAME##*-}
              export SERVER_BASEPATH="/${ORDINAL}"
              export SERVER_REWRITEBASEPATH=true
              export SERVER_PUBLICBASEURL="https://{{ .Values.domain }}/${ORDINAL}"

              echo "Waiting for Elasticsearch..."
              until curl -sf -u "elastic:${ELASTIC_PASSWORD}" http://localhost:9200/_cluster/health > /dev/null 2>&1; do
                sleep 2
              done
              echo "Elasticsearch is ready. Setting kibana_system password..."
              curl -sf -X POST -u "elastic:${ELASTIC_PASSWORD}" \
                -H 'Content-Type: application/json' \
                http://localhost:9200/_security/user/kibana_system/_password \
                -d "{\"password\":\"${ELASTIC_PASSWORD}\"}"
              echo ""
              echo "kibana_system password set. Starting Kibana..."

              exec /usr/local/bin/kibana-docker
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "elastic-training.fullname" . }}
                  key: elastic-password
            - name: ELASTICSEARCH_HOSTS
              value: "http://localhost:9200"
            - name: ELASTICSEARCH_USERNAME
              value: kibana_system
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "elastic-training.fullname" . }}
                  key: elastic-password
            - name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "elastic-training.fullname" . }}
                  key: encryption-key
            - name: TELEMETRY_ENABLED
              value: "false"
          ports:
            - name: kibana
              containerPort: 5601
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "curl -sf http://localhost:5601/${HOSTNAME##*-}/api/status | grep -q '\"overall\"'"
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 128m
              memory: 768Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.elasticsearch.storage }}
