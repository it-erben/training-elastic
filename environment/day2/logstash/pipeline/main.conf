# Logstash-Pipeline für Tag 2.
#
# Ausgangszustand: nimmt Events von Filebeat entgegen und gibt sie auf
# der Konsole aus (docker compose logs -f logstash).
# Wird in den Labs 06-07 um Filter und den Elasticsearch-Output erweitert.
#
# Änderungen werden automatisch neu geladen (config.reload.automatic).

input {
  beats {
    port => 5044
  }
}

filter {
  # Lab 06: mutate, date, Conditionals
  # Lab 07: grok, geoip
}

output {
  stdout {
    codec => rubydebug
  }
}
