# Kibana-Konfiguration für den Tag-3-Cluster (Security an, TLS zu ES).
#
# Fleet ist vorkonfiguriert (xpack.fleet.*), damit das Fleet-Lab ohne
# manuelle Klick-Konfiguration funktioniert -- die Services fleet-server
# und agent werden per "docker compose --profile fleet up -d" gestartet.

server.host: "0.0.0.0"
server.publicBaseUrl: "http://localhost:5601"

elasticsearch.hosts: ["https://es01:9200"]
elasticsearch.username: "kibana_system"
elasticsearch.password: "${KIBANA_PASSWORD}"
elasticsearch.ssl.certificateAuthorities:
  ["/usr/share/kibana/config/certs/ca/ca.crt"]

telemetry.enabled: false

# Feste Encryption-Keys (Wegwerf-Schulungswerte) -- nötig für Fleet,
# Alerting und gespeicherte Objekte
xpack.encryptedSavedObjects.encryptionKey: "schulung-nur-fuer-training-0000001"
xpack.security.encryptionKey: "schulung-nur-fuer-training-0000002"
xpack.reporting.encryptionKey: "schulung-nur-fuer-training-0000003"

# --- Fleet-Vorkonfiguration ---
xpack.fleet.agents.fleet_server.hosts: ["https://fleet-server:8220"]

xpack.fleet.outputs:
  - id: default-output
    name: default
    type: elasticsearch
    hosts: ["https://es01:9200"]
    is_default: true
    is_default_monitoring: true
    ssl:
      certificate_authorities: ["/certs/ca/ca.crt"]

xpack.fleet.packages:
  - name: fleet_server
    version: latest
  - name: system
    version: latest

xpack.fleet.agentPolicies:
  - name: Fleet Server Policy
    id: fleet-server-policy
    namespace: default
    is_default_fleet_server: true
    monitoring_enabled: []
    package_policies:
      - name: fleet_server-1
        package:
          name: fleet_server
  - name: Agent Policy Training
    id: agent-policy-training
    namespace: default
    monitoring_enabled: []
    package_policies:
      - name: system-1
        package:
          name: system
