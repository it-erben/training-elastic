<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- Cluster (live) -->
  <g filter="url(#ieShadow)">
    <rect x="60" y="80" width="300" height="140" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/>
  </g>
  <text x="210" y="130" text-anchor="middle" fill="#172033" font-size="27" font-weight="700">Cluster (live)</text>
  <text x="210" y="165" text-anchor="middle" fill="#5B6675" font-size="20" font-weight="400">Indizes,</text>
  <text x="210" y="192" text-anchor="middle" fill="#5B6675" font-size="20" font-weight="400">Data Streams</text>

  <!-- Snapshot arrow (Cluster -> Repository) -->
  <text x="500" y="112" text-anchor="middle" fill="#5B6675" font-size="20" font-weight="600">Snapshot</text>
  <line x1="360" y1="128" x2="640" y2="128" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>

  <!-- Restore arrow (Repository -> Cluster) -->
  <line x1="640" y1="176" x2="360" y2="176" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>
  <text x="500" y="205" text-anchor="middle" fill="#5B6675" font-size="20" font-weight="600">Restore</text>

  <!-- Repository (Akzent, blau) -->
  <g filter="url(#ieShadow)">
    <rect x="640" y="80" width="300" height="140" rx="16" fill="#1B4FD8"/>
  </g>
  <text x="790" y="130" text-anchor="middle" fill="#FFFFFF" font-size="27" font-weight="700">Repository</text>
  <text x="790" y="165" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="400" opacity="0.9">fs / s3 / gcs</text>
  <text x="790" y="192" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="400" opacity="0.9">snapshot-1..N</text>
</svg>
