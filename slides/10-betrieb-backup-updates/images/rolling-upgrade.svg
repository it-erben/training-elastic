<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
  </defs>

  <!-- Zustand 1: alle 9.0 -->
  <rect x="40" y="24" width="620" height="70" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="195" y="69" font-size="26" font-weight="700" fill="#172033" text-anchor="middle">es01 (9.0)</text>
  <text x="350" y="69" font-size="26" font-weight="700" fill="#172033" text-anchor="middle">es02 (9.0)</text>
  <text x="505" y="69" font-size="26" font-weight="700" fill="#172033" text-anchor="middle">es03 (9.0)</text>

  <line x1="350" y1="100" x2="350" y2="134" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <text x="372" y="123" font-size="20" fill="#5B6675">Node stoppen, upgraden, starten</text>

  <!-- Zustand 2: Mischbetrieb -->
  <rect x="40" y="140" width="620" height="70" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="195" y="185" font-size="26" font-weight="700" fill="#1B4FD8" text-anchor="middle">es01 (9.1)</text>
  <text x="350" y="185" font-size="26" font-weight="700" fill="#172033" text-anchor="middle">es02 (9.0)</text>
  <text x="505" y="185" font-size="26" font-weight="700" fill="#172033" text-anchor="middle">es03 (9.0)</text>
  <text x="684" y="182" font-size="20" fill="#5B6675">Mischbetrieb, OK</text>

  <line x1="350" y1="216" x2="350" y2="250" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <text x="372" y="239" font-size="20" fill="#5B6675">warten bis Cluster grün, dann nächster Node</text>

  <!-- Zustand 3 -->
  <rect x="40" y="256" width="620" height="70" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="195" y="301" font-size="26" font-weight="700" fill="#1B4FD8" text-anchor="middle">es01 (9.1)</text>
  <text x="350" y="301" font-size="26" font-weight="700" fill="#1B4FD8" text-anchor="middle">es02 (9.1)</text>
  <text x="505" y="301" font-size="26" font-weight="700" fill="#172033" text-anchor="middle">es03 (9.0)</text>

  <line x1="350" y1="332" x2="350" y2="366" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <!-- Zustand 4: fertig (Akzent) -->
  <rect x="40" y="372" width="620" height="70" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="195" y="417" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">es01 (9.1)</text>
  <text x="350" y="417" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">es02 (9.1)</text>
  <text x="505" y="417" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">es03 (9.1)</text>
  <text x="684" y="414" font-size="20" fill="#5B6675">fertig</text>
</svg>
