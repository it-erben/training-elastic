<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 310" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="ieBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF1F8"/>
      <stop offset="1" stop-color="#E3E9F6"/>
    </linearGradient>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Container: RAM des Nodes -->
  <rect x="30" y="20" width="1000" height="270" rx="24" fill="url(#ieBg)" stroke="#D5DBEA"/>
  <text x="90" y="78" font-size="21" font-weight="600" letter-spacing="3" fill="#1B4FD8">RAM EINES NODES (Z. B. 64 GB)</text>

  <!-- JVM-Heap (Akzent) -->
  <rect x="90" y="108" width="430" height="150" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="305" y="160" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">JVM-Heap (max. 50%)</text>
  <text x="305" y="197" font-size="21" fill="#DDE6FB" text-anchor="middle">Aggregationen, Indexing-Buffer,</text>
  <text x="305" y="226" font-size="21" fill="#DDE6FB" text-anchor="middle">Cluster-State</text>

  <!-- Filesystem-Cache -->
  <rect x="560" y="108" width="430" height="150" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="775" y="160" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Filesystem-Cache (Rest)</text>
  <text x="775" y="197" font-size="21" fill="#5B6675" text-anchor="middle">Lucene-Segmente werden vom</text>
  <text x="775" y="226" font-size="21" fill="#5B6675" text-anchor="middle">OS gecacht → schnelle Suchen</text>
</svg>
