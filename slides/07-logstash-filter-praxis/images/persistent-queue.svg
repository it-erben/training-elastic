<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 270" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="220" height="100" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="150" y="100" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Input</text>

  <line x1="266" y1="90" x2="312" y2="90" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <rect x="320" y="40" width="300" height="100" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="470" y="100" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Queue auf Disk</text>

  <line x1="626" y1="90" x2="672" y2="90" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <rect x="680" y="40" width="220" height="100" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="790" y="100" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Filter</text>

  <line x1="906" y1="90" x2="952" y2="90" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <rect x="960" y="40" width="220" height="100" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="1070" y="100" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Output</text>

  <!-- Annotation unter der Queue -->
  <path d="M 470 148 L 470 215 Q 470 227 482 227 L 500 227" fill="none" stroke="#5B6675" stroke-width="2.5"/>
  <text x="516" y="234" font-size="20" fill="#5B6675">übersteht <tspan font-weight="700" fill="#172033">Neustart &amp; Absturz</tspan></text>
</svg>
