<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="ieBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF1F8"/>
      <stop offset="1" stop-color="#E3E9F6"/>
    </linearGradient>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Container: Kibana Maps -->
  <rect x="40" y="40" width="1080" height="540" rx="24" fill="url(#ieBg)" stroke="#D5DBEA"/>
  <text x="110" y="102" font-size="21" font-weight="600" letter-spacing="3" fill="#1B4FD8">KIBANA MAPS – LAYER "DOCUMENTS" / "CLUSTERS"</text>

  <!-- Kartenfläche -->
  <rect x="110" y="140" width="560" height="390" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>

  <!-- Europa: dichtes Cluster -->
  <circle cx="340" cy="240" r="11" fill="#1B4FD8"/>
  <circle cx="366" cy="233" r="9" fill="#1B4FD8"/>
  <circle cx="391" cy="249" r="10" fill="#1B4FD8"/>
  <circle cx="345" cy="266" r="9" fill="#1B4FD8"/>
  <circle cx="371" cy="262" r="12" fill="#1B4FD8"/>
  <circle cx="397" cy="272" r="8" fill="#1B4FD8"/>
  <circle cx="329" cy="252" r="8" fill="#1B4FD8"/>
  <circle cx="416" cy="257" r="9" fill="#1B4FD8"/>
  <circle cx="381" cy="287" r="9" fill="#1B4FD8"/>
  <circle cx="355" cy="291" r="8" fill="#1B4FD8"/>

  <!-- Einzelne Cluster: USA, Brasilien, Japan, Australien -->
  <circle cx="185" cy="265" r="8" fill="#1B4FD8"/>
  <circle cx="210" cy="298" r="7" fill="#1B4FD8"/>
  <circle cx="255" cy="435" r="8" fill="#1B4FD8"/>
  <circle cx="612" cy="290" r="8" fill="#1B4FD8"/>
  <circle cx="588" cy="445" r="8" fill="#1B4FD8"/>
  <circle cx="470" cy="360" r="7" fill="#1B4FD8"/>

  <!-- Beschriftungen rechts -->
  <text x="720" y="190" font-size="20" fill="#5B6675">Data View: <tspan font-weight="700" fill="#172033">weblogs</tspan></text>
  <text x="720" y="226" font-size="20" fill="#5B6675">Geo-Feld: <tspan font-weight="700" fill="#172033">source.geo.location</tspan></text>
  <text x="720" y="256" font-size="20" fill="#5B6675">(automatisch erkannt)</text>

  <text x="720" y="336" font-size="20" fill="#5B6675"><tspan font-weight="700" fill="#172033">Europa:</tspan> dicht</text>

  <text x="720" y="410" font-size="20" fill="#5B6675"><tspan font-weight="700" fill="#172033">USA, Brasilien, Japan,</tspan></text>
  <text x="720" y="440" font-size="20" fill="#5B6675"><tspan font-weight="700" fill="#172033">Australien:</tspan></text>
  <text x="720" y="470" font-size="20" fill="#5B6675">einzelne Cluster</text>
</svg>
