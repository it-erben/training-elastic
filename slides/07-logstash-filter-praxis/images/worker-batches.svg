<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 460" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
  </defs>

  <!-- Queue -->
  <rect x="40" y="185" width="220" height="100" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="150" y="245" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Queue</text>

  <!-- Fächer-Pfeile zu den Workern -->
  <line x1="266" y1="220" x2="350" y2="105" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="266" y1="235" x2="350" y2="235" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="266" y1="250" x2="350" y2="365" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <!-- Worker -->
  <rect x="360" y="55" width="220" height="80" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="470" y="105" font-size="28" font-weight="700" fill="#172033" text-anchor="middle">Worker 1</text>
  <rect x="360" y="195" width="220" height="80" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="470" y="245" font-size="28" font-weight="700" fill="#172033" text-anchor="middle">Worker 2</text>
  <rect x="360" y="335" width="220" height="80" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="470" y="385" font-size="28" font-weight="700" fill="#172033" text-anchor="middle">Worker n</text>

  <!-- Pfeile Worker -> Batch -->
  <line x1="586" y1="95" x2="632" y2="95" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="586" y1="235" x2="632" y2="235" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="586" y1="375" x2="632" y2="375" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <!-- Batches -->
  <rect x="640" y="55" width="300" height="80" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="790" y="104" font-size="24" font-weight="700" fill="#172033" text-anchor="middle">Batch: 125 Events</text>
  <rect x="640" y="195" width="300" height="80" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="790" y="244" font-size="24" font-weight="700" fill="#172033" text-anchor="middle">Batch: 125 Events</text>
  <rect x="640" y="335" width="300" height="80" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="790" y="384" font-size="24" font-weight="700" fill="#172033" text-anchor="middle">...</text>

  <!-- Pfeile Batch -> Output -->
  <line x1="946" y1="95" x2="988" y2="215" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="946" y1="235" x2="992" y2="235" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="946" y1="375" x2="988" y2="255" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <!-- Output -->
  <rect x="1000" y="185" width="200" height="100" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="1100" y="245" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Output</text>
</svg>
