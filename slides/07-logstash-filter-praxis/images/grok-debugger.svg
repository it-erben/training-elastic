<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 540" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
  </defs>

  <!-- Panel: Sample Data -->
  <rect x="40" y="30" width="980" height="130" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="80" y="78" font-size="24" font-weight="700" fill="#172033">Sample Data</text>
  <text x="80" y="122" font-size="20" fill="#5B6675" font-family="ui-monospace, 'SF Mono', Menlo, monospace">91.12.34.93 - - [30/Jun/2026:12:00:05 +0000] ...</text>

  <line x1="530" y1="168" x2="530" y2="196" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <!-- Panel: Grok Pattern -->
  <rect x="40" y="204" width="980" height="130" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="80" y="252" font-size="24" font-weight="700" fill="#172033">Grok Pattern</text>
  <text x="80" y="296" font-size="20" fill="#5B6675" font-family="ui-monospace, 'SF Mono', Menlo, monospace">%{IP:client} %{GREEDYDATA:rest}</text>

  <line x1="530" y1="342" x2="530" y2="370" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <!-- Panel: Structured Data mit Simulate-Button -->
  <rect x="40" y="378" width="980" height="130" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="80" y="426" font-size="24" font-weight="700" fill="#172033">Structured Data</text>
  <text x="80" y="470" font-size="20" fill="#5B6675" font-family="ui-monospace, 'SF Mono', Menlo, monospace">{ "client": "91.12.34.93", "rest": "- - [..." }</text>
  <rect x="830" y="398" width="150" height="46" rx="23" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="905" y="428" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Simulate</text>
</svg>
