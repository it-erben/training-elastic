<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- Tint-Gruppenflaeche hinter den Feldern -->
  <rect x="680" y="46" width="320" height="330" rx="20" fill="#EEF1F8"/>
  <text x="840" y="34" text-anchor="middle" fill="#5B6675" font-size="17" font-weight="600">strukturierte Felder</text>

  <!-- message (Rohzeile) -->
  <g filter="url(#ieShadow)"><rect x="30" y="160" width="240" height="100" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="150" y="200" text-anchor="middle" fill="#172033" font-size="26" font-weight="700">message</text>
  <text x="150" y="228" text-anchor="middle" fill="#5B6675" font-size="18" font-weight="400">eine Rohzeile</text>

  <!-- Pfeil 1 mit Pattern-Label -->
  <line x1="270" y1="210" x2="404" y2="210" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>

  <!-- Grok-Pattern (Blau-Hero) -->
  <g filter="url(#ieShadow)"><rect x="410" y="160" width="200" height="100" rx="16" fill="#1B4FD8"/></g>
  <text x="510" y="203" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">Grok-Pattern</text>
  <text x="510" y="232" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.85" font-size="13" font-weight="400">%{HTTPD_COMBINEDLOG}</text>

  <!-- Pfeil 2 in die Feld-Gruppe -->
  <line x1="610" y1="210" x2="676" y2="210" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>

  <!-- Feld-Boxen (Hairline) -->
  <g filter="url(#ieShadow)"><rect x="696" y="61" width="290" height="60" rx="12" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="710" y="97" fill="#172033" font-size="15" font-weight="600">source.address <tspan fill="#5B6675" font-weight="400">= 91.12.34.93</tspan></text>

  <g filter="url(#ieShadow)"><rect x="696" y="139" width="290" height="60" rx="12" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="710" y="175" fill="#172033" font-size="15" font-weight="600">http.request.method <tspan fill="#5B6675" font-weight="400">= GET</tspan></text>

  <g filter="url(#ieShadow)"><rect x="696" y="217" width="290" height="60" rx="12" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="710" y="253" fill="#172033" font-size="15" font-weight="600">http.response.status_code <tspan fill="#5B6675" font-weight="400">= 200</tspan></text>

  <g filter="url(#ieShadow)"><rect x="696" y="295" width="290" height="60" rx="12" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="710" y="331" fill="#172033" font-size="15" font-weight="600">url.original <tspan fill="#5B6675" font-weight="400">= /...</tspan></text>
</svg>
