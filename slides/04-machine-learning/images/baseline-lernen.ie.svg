<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- left group: baseline scatter -->
  <rect x="40" y="60" width="300" height="170" rx="20" fill="#EEF1F8"/>
  <text x="190" y="48" text-anchor="middle" fill="#5B6675" font-size="18" font-weight="600">lernt &quot;normal&quot;</text>
  <circle cx="80" cy="115" r="6" fill="#5B6675"/>
  <circle cx="112" cy="98" r="6" fill="#5B6675"/>
  <circle cx="98" cy="150" r="6" fill="#5B6675"/>
  <circle cx="135" cy="132" r="6" fill="#5B6675"/>
  <circle cx="165" cy="105" r="6" fill="#5B6675"/>
  <circle cx="152" cy="170" r="6" fill="#5B6675"/>
  <circle cx="190" cy="125" r="6" fill="#5B6675"/>
  <circle cx="215" cy="152" r="6" fill="#5B6675"/>
  <circle cx="205" cy="195" r="6" fill="#5B6675"/>
  <circle cx="245" cy="112" r="6" fill="#5B6675"/>
  <circle cx="258" cy="158" r="6" fill="#5B6675"/>
  <circle cx="290" cy="128" r="6" fill="#5B6675"/>
  <circle cx="278" cy="180" r="6" fill="#5B6675"/>
  <circle cx="125" cy="195" r="6" fill="#5B6675"/>
  <circle cx="235" cy="192" r="6" fill="#5B6675"/>

  <line x1="342" y1="145" x2="402" y2="145" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>

  <!-- hero: model -->
  <g filter="url(#ieShadow)"><rect x="410" y="105" width="180" height="80" rx="16" fill="#1B4FD8"/></g>
  <text x="500" y="145" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="26" font-weight="700">Modell</text>

  <line x1="592" y1="145" x2="652" y2="145" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>

  <!-- right group: new buckets + outlier -->
  <rect x="660" y="60" width="300" height="170" rx="20" fill="#EEF1F8"/>
  <text x="810" y="48" text-anchor="middle" fill="#5B6675" font-size="18" font-weight="600">bewertet neue Buckets</text>
  <circle cx="700" cy="150" r="6" fill="#5B6675"/>
  <circle cx="730" cy="120" r="6" fill="#5B6675"/>
  <circle cx="762" cy="160" r="6" fill="#5B6675"/>
  <circle cx="792" cy="130" r="6" fill="#5B6675"/>
  <circle cx="880" cy="148" r="6" fill="#5B6675"/>
  <circle cx="908" cy="122" r="6" fill="#5B6675"/>
  <circle cx="932" cy="162" r="6" fill="#5B6675"/>
  <circle cx="848" cy="182" r="6" fill="#5B6675"/>
  <circle cx="720" cy="188" r="6" fill="#5B6675"/>
  <!-- outlier (red accent) -->
  <line x1="820" y1="93" x2="838" y2="111" stroke="#C4453D" stroke-width="4" stroke-linecap="round"/>
  <line x1="838" y1="93" x2="820" y2="111" stroke="#C4453D" stroke-width="4" stroke-linecap="round"/>

  <!-- captions -->
  <text x="190" y="270" text-anchor="middle" fill="#172033" font-size="22" font-weight="700">Baseline-Zeitraum</text>
  <text x="190" y="298" text-anchor="middle" fill="#5B6675" font-size="19">Muster: Tag / Woche / Trend</text>
  <text x="810" y="270" text-anchor="middle" fill="#172033" font-size="22" font-weight="700">Ausreißer markiert</text>
  <text x="810" y="298" text-anchor="middle" fill="#C4453D" font-size="19" font-weight="600">hoher Score</text>
</svg>
