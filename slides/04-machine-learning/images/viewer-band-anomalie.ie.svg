<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- y-axis title -->
  <text x="86" y="42" fill="#172033" font-size="20" font-weight="700">mean(taxful_total_price)</text>

  <!-- expected band (neutral tint, narrows to the right) -->
  <path d="M110,220 C300,250 550,260 930,266 L930,300 C550,298 300,300 110,320 Z"
        fill="#E3E9F6" stroke="#D5DBEA" stroke-width="1.5"/>
  <text x="640" y="250" text-anchor="middle" fill="#5B6675" font-size="19">erwartetes Band &#183; typical ~71</text>

  <!-- axes -->
  <line x1="90" y1="345" x2="90.0" y2="68.0" stroke="#5B6675" stroke-width="2"/>
  <path d="M97.0,68.0 L83.0,68.0 L90,55 z" fill="#5B6675"/>
  <line x1="90" y1="345" x2="950" y2="345" stroke="#5B6675" stroke-width="2" marker-end="url(#ieArrow)"/>
  <text x="945" y="372" text-anchor="end" fill="#5B6675" font-size="19">Zeit</text>

  <!-- hero: actual line (blue) -->
  <polyline points="110,288 175,278 240,285 305,275 370,283 435,278 500,282 535,95 560,270 625,283 700,280 780,282 860,279 930,281"
            fill="none" stroke="#1B4FD8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- anomaly point (red accent) -->
  <circle cx="535" cy="95" r="9" fill="#C4453D"/>
  <text x="558" y="90" fill="#C4453D" font-size="20" font-weight="700">actual 542</text>
  <text x="558" y="114" fill="#5B6675" font-size="18">Score 90</text>

  <!-- legend -->
  <line x1="120" y1="398" x2="165" y2="398" stroke="#1B4FD8" stroke-width="3" stroke-linecap="round"/>
  <text x="175" y="404" fill="#172033" font-size="19">Ist-Linie</text>
  <rect x="320" y="389" width="42" height="18" rx="4" fill="#E3E9F6" stroke="#D5DBEA" stroke-width="1.5"/>
  <text x="372" y="404" fill="#172033" font-size="19">gelernte Baseline</text>
</svg>
