<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- Gruppenflaeche hinter den Bedingungen -->
  <rect x="30" y="20" width="400" height="320" rx="20" fill="#EEF1F8"/>

  <!-- Bedingung 1: max_age -->
  <g filter="url(#ieShadow)">
    <rect x="50" y="36" width="360" height="72" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/>
  </g>
  <text x="70" y="68" fill="#172033" font-size="22" font-weight="700">max_age</text>
  <text x="70" y="93" fill="#5B6675" font-size="19" font-weight="400">30 Tage</text>

  <!-- Bedingung 2: max_docs -->
  <g filter="url(#ieShadow)">
    <rect x="50" y="144" width="360" height="72" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/>
  </g>
  <text x="70" y="176" fill="#172033" font-size="22" font-weight="700">max_docs</text>
  <text x="70" y="201" fill="#5B6675" font-size="19" font-weight="400">200 Mio. Dokumente</text>

  <!-- Bedingung 3: max_primary_shard_size -->
  <g filter="url(#ieShadow)">
    <rect x="50" y="252" width="360" height="72" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/>
  </g>
  <text x="70" y="284" fill="#172033" font-size="22" font-weight="700">max_primary_shard_size</text>
  <text x="70" y="309" fill="#5B6675" font-size="19" font-weight="400">50 GB</text>

  <!-- Zusammenlaufende Linien zur Junction -->
  <line x1="410" y1="72"  x2="592" y2="180" stroke="#5B6675" stroke-width="2.5"/>
  <line x1="410" y1="180" x2="592" y2="180" stroke="#5B6675" stroke-width="2.5"/>
  <line x1="410" y1="288" x2="592" y2="180" stroke="#5B6675" stroke-width="2.5"/>
  <circle cx="596" cy="180" r="6" fill="#5B6675"/>

  <!-- ODER-Hinweis -->
  <text x="596" y="210" text-anchor="middle" fill="#5B6675" font-size="14" font-weight="600">ODER</text>

  <!-- Pfeil zur Akzent-Box -->
  <line x1="602" y1="180" x2="700" y2="180" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>
  <text x="648" y="166" text-anchor="middle" fill="#5B6675" font-size="14">erste erfuellt</text>

  <!-- Akzent-Box: ROLLOVER (genau eine Blau-Box) -->
  <g filter="url(#ieShadow)">
    <rect x="705" y="132" width="245" height="96" rx="16" fill="#1B4FD8"/>
  </g>
  <text x="827" y="180" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="28" font-weight="700">ROLLOVER</text>
</svg>
