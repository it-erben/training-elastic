<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1550 300" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
    <marker id="ieArrowGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- HOT (Akzent) -->
  <rect x="20" y="40" width="270" height="150" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="155" y="92" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">HOT</text>
  <text x="155" y="127" font-size="21" fill="#DDE6FB" text-anchor="middle">schreiben + suchen</text>
  <text x="155" y="156" font-size="21" fill="#DDE6FB" text-anchor="middle">schnelle Hardware</text>

  <!-- WARM -->
  <rect x="330" y="40" width="270" height="150" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="465" y="92" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">WARM</text>
  <text x="465" y="127" font-size="21" fill="#5B6675" text-anchor="middle">nur lesen + suchen</text>
  <text x="465" y="156" font-size="21" fill="#5B6675" text-anchor="middle">günstigere Hardware</text>

  <!-- COLD -->
  <rect x="640" y="40" width="270" height="150" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="775" y="92" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">COLD</text>
  <text x="775" y="127" font-size="21" fill="#5B6675" text-anchor="middle">selten lesen + suchen</text>
  <text x="775" y="156" font-size="21" fill="#5B6675" text-anchor="middle">günstige Hardware</text>

  <!-- FROZEN -->
  <rect x="950" y="40" width="270" height="150" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="1085" y="92" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">FROZEN</text>
  <text x="1085" y="127" font-size="21" fill="#5B6675" text-anchor="middle">Archivabfragen</text>
  <text x="1085" y="156" font-size="21" fill="#5B6675" text-anchor="middle">Snapshot-Speicher</text>

  <!-- DELETE -->
  <rect x="1260" y="40" width="270" height="150" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="1395" y="92" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">DELETE</text>
  <text x="1395" y="127" font-size="21" fill="#5B6675" text-anchor="middle">Index wird gelöscht</text>

  <!-- Flusspfeile -->
  <line x1="296" y1="115" x2="322" y2="115" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="606" y1="115" x2="632" y2="115" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="916" y1="115" x2="942" y2="115" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="1226" y1="115" x2="1252" y2="115" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <!-- Zeitachse -->
  <text x="775" y="240" font-size="21" fill="#5B6675" text-anchor="middle">Zeit</text>
  <line x1="20" y1="258" x2="1510" y2="258" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrowGrey)"/>
</svg>
