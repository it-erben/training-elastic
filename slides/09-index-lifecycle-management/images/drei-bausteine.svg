<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
  </defs>

  <!-- ILM-Policy -->
  <rect x="40" y="60" width="300" height="130" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="190" y="118" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">ILM-Policy</text>
  <text x="190" y="155" font-size="21" fill="#5B6675" text-anchor="middle">Phasen + Aktionen</text>

  <!-- Index-Template -->
  <rect x="560" y="40" width="380" height="190" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="750" y="92" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Index-Template</text>
  <text x="750" y="128" font-size="21" fill="#5B6675" text-anchor="middle">index_patterns: transactions-*</text>
  <text x="750" y="157" font-size="21" fill="#5B6675" text-anchor="middle">lifecycle.name</text>
  <text x="750" y="186" font-size="21" fill="#5B6675" text-anchor="middle">rollover_alias</text>

  <!-- Pfeil Template -> Policy -->
  <line x1="552" y1="125" x2="356" y2="125" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <!-- Pfeil Template -> Bootstrap-Index -->
  <line x1="750" y1="238" x2="750" y2="292" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <text x="728" y="272" font-size="20" fill="#5B6675" text-anchor="end">greift bei jedem neuen Index</text>

  <!-- Bootstrap-Index (Akzent) -->
  <rect x="540" y="300" width="420" height="160" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="750" y="350" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Bootstrap-Index</text>
  <text x="750" y="385" font-size="21" fill="#DDE6FB" text-anchor="middle">transactions-000001</text>
  <text x="750" y="412" font-size="21" fill="#DDE6FB" text-anchor="middle">+ Alias transactions-live</text>
  <text x="750" y="439" font-size="21" fill="#DDE6FB" text-anchor="middle">(is_write_index: true)</text>
</svg>
