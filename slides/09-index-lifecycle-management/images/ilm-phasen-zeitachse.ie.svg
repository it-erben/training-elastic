<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- Achsen-Hinweis -->
  <text x="60" y="34" fill="#5B6675" font-size="18" font-weight="600">Alter ab Rollover &#8594;</text>

  <!-- HOT (Akzent-Box: aktiver Schreibindex) -->
  <g filter="url(#ieShadow)">
    <rect x="60" y="62" width="195" height="78" rx="16" fill="#1B4FD8"/>
  </g>
  <text x="157" y="96" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">HOT</text>
  <text x="157" y="122" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="400">schreiben &amp; Analyse</text>

  <!-- WARM -->
  <g filter="url(#ieShadow)">
    <rect x="285" y="62" width="195" height="78" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/>
  </g>
  <text x="382" y="96" text-anchor="middle" fill="#172033" font-size="24" font-weight="700">WARM</text>
  <text x="382" y="122" text-anchor="middle" fill="#5B6675" font-size="17" font-weight="400">Reports</text>

  <!-- COLD -->
  <g filter="url(#ieShadow)">
    <rect x="510" y="62" width="195" height="78" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/>
  </g>
  <text x="607" y="96" text-anchor="middle" fill="#172033" font-size="24" font-weight="700">COLD</text>
  <text x="607" y="122" text-anchor="middle" fill="#5B6675" font-size="17" font-weight="400">Audits, selten</text>

  <!-- DELETE -->
  <g filter="url(#ieShadow)">
    <rect x="735" y="62" width="205" height="78" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/>
  </g>
  <text x="837" y="96" text-anchor="middle" fill="#172033" font-size="24" font-weight="700">DELETE</text>
  <text x="837" y="122" text-anchor="middle" fill="#5B6675" font-size="17" font-weight="400">Index loeschen</text>

  <!-- Flusspfeile zwischen den Phasen -->
  <line x1="257" y1="101" x2="283" y2="101" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>
  <line x1="482" y1="101" x2="508" y2="101" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>
  <line x1="707" y1="101" x2="733" y2="101" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>

  <!-- Zeitachse -->
  <line x1="60" y1="200" x2="940" y2="200" stroke="#D5DBEA" stroke-width="2"/>
  <!-- Ticks -->
  <line x1="60"  y1="192" x2="60"  y2="208" stroke="#5B6675" stroke-width="2"/>
  <line x1="285" y1="192" x2="285" y2="208" stroke="#5B6675" stroke-width="2"/>
  <line x1="510" y1="192" x2="510" y2="208" stroke="#5B6675" stroke-width="2"/>
  <line x1="735" y1="192" x2="735" y2="208" stroke="#5B6675" stroke-width="2"/>
  <!-- Alter-Labels -->
  <text x="60"  y="238" text-anchor="middle" fill="#172033" font-size="20" font-weight="700">0 d</text>
  <text x="285" y="238" text-anchor="middle" fill="#172033" font-size="20" font-weight="700">30 d</text>
  <text x="510" y="238" text-anchor="middle" fill="#172033" font-size="20" font-weight="700">180 d</text>
  <text x="735" y="238" text-anchor="middle" fill="#172033" font-size="20" font-weight="700">365 d</text>
</svg>
