<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 360" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
  </defs>

  <!-- Alias -->
  <rect x="775" y="30" width="420" height="90" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="985" y="86" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Alias: transactions-live</text>

  <!-- Pfeil Alias -> Write-Index -->
  <line x1="985" y1="120" x2="985" y2="200" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <text x="963" y="167" font-size="20" fill="#5B6675" text-anchor="end">is_write_index</text>

  <!-- Indizes -->
  <rect x="30" y="210" width="350" height="112" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="205" y="257" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">transactions-000001</text>
  <text x="205" y="292" font-size="21" fill="#5B6675" text-anchor="middle">alt, read-only</text>

  <rect x="420" y="210" width="350" height="112" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="595" y="257" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">transactions-000002</text>
  <text x="595" y="292" font-size="21" fill="#5B6675" text-anchor="middle">alt, read-only</text>

  <rect x="810" y="210" width="350" height="112" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="985" y="257" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">transactions-000003</text>
  <text x="985" y="292" font-size="21" fill="#DDE6FB" text-anchor="middle">aktiv, schreibbar</text>
</svg>
