<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- Parent: Data Stream -->
  <g filter="url(#ieShadow)"><rect x="250" y="24" width="500" height="66" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="500" y="50" text-anchor="middle" fill="#5B6675" font-size="17" font-weight="600" letter-spacing="1">DATA STREAM</text>
  <text x="500" y="74" text-anchor="middle" fill="#172033" font-size="22" font-weight="700">logs-mustertech-default</text>

  <!-- tree rail -->
  <path d="M500 90 L500 104 L300 104 L300 286" fill="none" stroke="#5B6675" stroke-width="2"/>
  <line x1="300" y1="146" x2="338" y2="146" stroke="#5B6675" stroke-width="2"/>
  <line x1="300" y1="216" x2="338" y2="216" stroke="#5B6675" stroke-width="2"/>
  <line x1="300" y1="286" x2="338" y2="286" stroke="#5B6675" stroke-width="2"/>

  <!-- backing index 1 -->
  <g filter="url(#ieShadow)"><rect x="340" y="122" width="560" height="48" rx="12" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="364" y="146" text-anchor="start" dominant-baseline="middle" fill="#172033" font-size="20" font-weight="500">.ds-logs-mustertech-default-2026.07.02-000001</text>

  <!-- backing index 2 -->
  <g filter="url(#ieShadow)"><rect x="340" y="192" width="560" height="48" rx="12" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="364" y="216" text-anchor="start" dominant-baseline="middle" fill="#172033" font-size="20" font-weight="500">.ds-logs-mustertech-default-2026.07.02-000002</text>

  <!-- backing index 3 = write index (hero) -->
  <g filter="url(#ieShadow)"><rect x="340" y="256" width="560" height="60" rx="12" fill="#1B4FD8"/></g>
  <text x="364" y="280" text-anchor="start" dominant-baseline="middle" fill="#FFFFFF" font-size="20" font-weight="600">.ds-logs-mustertech-default-2026.07.02-000003</text>
