<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 180" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
  </defs>

  <!-- Basic (Akzent: Standardlizenz) -->
  <rect x="20" y="20" width="340" height="140" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="190" y="80" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Basic (kostenlos)</text>
  <text x="190" y="115" font-size="21" fill="#DDE6FB" text-anchor="middle">im Download enthalten</text>

  <line x1="368" y1="90" x2="412" y2="90" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <!-- Platinum -->
  <rect x="420" y="20" width="340" height="140" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="590" y="80" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Platinum</text>
  <text x="590" y="115" font-size="21" fill="#5B6675" text-anchor="middle">Abo/Cloud</text>

  <line x1="768" y1="90" x2="812" y2="90" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <!-- Enterprise -->
  <rect x="820" y="20" width="340" height="140" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="990" y="80" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Enterprise</text>
  <text x="990" y="115" font-size="21" fill="#5B6675" text-anchor="middle">Abo/Cloud</text>
</svg>
