<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 470" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
  </defs>

  <!-- User -->
  <rect x="464" y="20" width="360" height="96" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="644" y="78" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">User "analyst"</text>

  <line x1="644" y1="116" x2="644" y2="156" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <!-- Rolle (Akzent) -->
  <rect x="404" y="164" width="480" height="96" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="644" y="222" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Rolle "mustertech-lesen"</text>

  <line x1="494" y1="260" x2="240" y2="330" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="644" y1="260" x2="644" y2="330" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="794" y1="260" x2="1048" y2="330" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <!-- Cluster-Privilegien -->
  <rect x="20" y="340" width="400" height="110" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="220" y="386" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Cluster-Privilegien</text>
  <text x="220" y="421" font-size="21" fill="#5B6675" text-anchor="middle">z. B. monitor</text>

  <!-- Index-Privilegien -->
  <rect x="444" y="340" width="400" height="110" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="644" y="386" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Index-Privilegien</text>
  <text x="644" y="421" font-size="21" fill="#5B6675" text-anchor="middle">z. B. read auf bestimmte Indizes</text>

  <!-- Kibana-Privilegien -->
  <rect x="868" y="340" width="400" height="110" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="1068" y="386" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Kibana-Privilegien</text>
  <text x="1068" y="421" font-size="21" fill="#5B6675" text-anchor="middle">z. B. Discover: Read</text>
</svg>
