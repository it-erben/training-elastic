<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- Logdatei -->
  <g filter="url(#ieShadow)"><rect x="370" y="18" width="260" height="66" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="500" y="51" text-anchor="middle" dominant-baseline="middle" fill="#172033" font-size="22" font-weight="700">apache-access.log</text>

  <line x1="500" y1="84" x2="500" y2="113" stroke="#5B6675" stroke-width="2.5"/>
  <path d="M492,111 L508,111 L500,124 z" fill="#5B6675"/>

  <!-- Filebeat Gruppe -->
  <rect x="60" y="128" width="880" height="280" rx="20" fill="#EEF1F8"/>
  <text x="92" y="163" fill="#172033" font-size="24" font-weight="700">Filebeat</text>

  <!-- innere Bausteine -->
  <g filter="url(#ieShadow)"><rect x="90" y="188" width="185" height="82" rx="14" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="182" y="229" text-anchor="middle" dominant-baseline="middle" fill="#172033" font-size="19" font-weight="700">filestream-Input</text>

  <line x1="275" y1="229" x2="301" y2="229" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>

  <g filter="url(#ieShadow)"><rect x="301" y="188" width="185" height="82" rx="14" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="393" y="221" text-anchor="middle" fill="#172033" font-size="19" font-weight="700">Harvester</text>
  <text x="393" y="245" text-anchor="middle" fill="#5B6675" font-size="15" font-weight="400">liest zeilenweise</text>

  <line x1="486" y1="229" x2="512" y2="229" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>

  <g filter="url(#ieShadow)"><rect x="512" y="188" width="185" height="82" rx="14" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="604" y="221" text-anchor="middle" fill="#172033" font-size="19" font-weight="700">Parser</text>
  <text x="604" y="245" text-anchor="middle" fill="#5B6675" font-size="15" font-weight="400">JSON / Multiline</text>

  <line x1="697" y1="229" x2="723" y2="229" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>

  <g filter="url(#ieShadow)"><rect x="723" y="188" width="185" height="82" rx="14" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="815" y="221" text-anchor="middle" fill="#172033" font-size="19" font-weight="700">Output</text>
  <text x="815" y="245" text-anchor="middle" fill="#5B6675" font-size="15" font-weight="400">bündelt Events</text>

  <!-- Registry -->
  <g filter="url(#ieShadow)"><rect x="90" y="300" width="818" height="76" rx="14" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="499" y="331" text-anchor="middle" fill="#172033" font-size="20" font-weight="700">Registry</text>
  <text x="499" y="355" text-anchor="middle" fill="#5B6675" font-size="16" font-weight="400">merkt sich: bis wohin wurde jede Datei gelesen?</text>

  <line x1="500" y1="408" x2="500" y2="437" stroke="#5B6675" stroke-width="2.5"/>
  <path d="M492,435 L508,435 L500,448 z" fill="#5B6675"/>

  <!-- Ziel: Elasticsearch (Hero) -->
  <g filter="url(#ieShadow)"><rect x="370" y="452" width="260" height="70" rx="16" fill="#1B4FD8"/></g>
  <text x="500" y="487" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="24" font-weight="700">Elasticsearch</text>
</svg>
