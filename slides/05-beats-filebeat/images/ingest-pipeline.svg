<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 640" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="ieBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF1F8"/>
      <stop offset="1" stop-color="#E3E9F6"/>
    </linearGradient>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
  </defs>

  <!-- Filebeat -->
  <rect x="40" y="203" width="230" height="104" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="155" y="265" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Filebeat</text>

  <!-- Container: Elasticsearch -->
  <rect x="390" y="40" width="720" height="570" rx="24" fill="url(#ieBg)" stroke="#D5DBEA"/>
  <text x="440" y="100" font-size="21" font-weight="600" letter-spacing="3" fill="#1B4FD8">ELASTICSEARCH</text>

  <!-- Ingest Pipeline (Akzent) -->
  <rect x="460" y="130" width="580" height="260" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="750" y="180" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ingest Pipeline</text>
  <text x="520" y="222" font-size="21" fill="#DDE6FB">1. grok (Zeile zerlegen)</text>
  <text x="520" y="256" font-size="21" fill="#DDE6FB">2. date (Zeitstempel übernehmen)</text>
  <text x="520" y="290" font-size="21" fill="#DDE6FB">3. geoip (IP → Standort)</text>
  <text x="520" y="324" font-size="21" fill="#DDE6FB">4. user_agent (Browser erkennen)</text>

  <!-- Index -->
  <rect x="620" y="470" width="260" height="104" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="750" y="532" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Index</text>

  <!-- Pfeile -->
  <line x1="270" y1="255" x2="452" y2="255" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="750" y1="390" x2="750" y2="462" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
</svg>
