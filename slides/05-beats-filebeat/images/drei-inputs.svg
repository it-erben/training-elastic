<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 510" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
  </defs>

  <!-- Zeile 1: apache-access.log -->
  <rect x="40" y="40" width="420" height="104" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="250" y="102" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">/data/apache-access.log</text>
  <rect x="560" y="40" width="480" height="104" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="800" y="85" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">filestream</text>
  <text x="800" y="120" font-size="21" fill="#5B6675" text-anchor="middle">zeilenweise</text>

  <!-- Zeile 2: app-json.log -->
  <rect x="40" y="200" width="420" height="104" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="250" y="262" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">/data/app-json.log</text>
  <rect x="560" y="200" width="480" height="104" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="800" y="245" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">filestream</text>
  <text x="800" y="280" font-size="21" fill="#5B6675" text-anchor="middle">+ ndjson-Parser</text>

  <!-- Zeile 3: java-app.log -->
  <rect x="40" y="360" width="420" height="104" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="250" y="422" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">/data/java-app.log</text>
  <rect x="560" y="360" width="480" height="104" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="800" y="405" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">filestream</text>
  <text x="800" y="440" font-size="21" fill="#5B6675" text-anchor="middle">+ multiline-Parser</text>

  <!-- ES (Akzent) -->
  <rect x="1130" y="200" width="180" height="104" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="1220" y="262" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">ES</text>
  <text x="1220" y="352" font-size="20" fill="#5B6675" text-anchor="middle">Data View: <tspan font-weight="700" fill="#172033">filebeat-*</tspan></text>

  <!-- Pfeile links -> Mitte -->
  <line x1="464" y1="92" x2="552" y2="92" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="464" y1="252" x2="552" y2="252" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="464" y1="412" x2="552" y2="412" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <!-- Pfeile Mitte -> ES -->
  <line x1="1044" y1="92" x2="1122" y2="228" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="1044" y1="252" x2="1122" y2="252" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="1044" y1="412" x2="1122" y2="276" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
</svg>
