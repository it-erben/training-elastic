<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 150" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
  </defs>

  <!-- lesen -->
  <rect x="20" y="20" width="170" height="104" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="105" y="82" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">lesen</text>

  <!-- senden -->
  <rect x="250" y="20" width="190" height="104" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="345" y="82" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">senden</text>

  <!-- Bestätigung -->
  <rect x="500" y="20" width="250" height="104" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="625" y="82" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Bestätigung</text>

  <!-- Registry-Offset vorrücken (Akzent) -->
  <rect x="810" y="20" width="450" height="104" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="1035" y="82" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Registry-Offset vorrücken</text>

  <!-- Pfeile -->
  <line x1="194" y1="72" x2="242" y2="72" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="444" y1="72" x2="492" y2="72" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="754" y1="72" x2="802" y2="72" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
</svg>
