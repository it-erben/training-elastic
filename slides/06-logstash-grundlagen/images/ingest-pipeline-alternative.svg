<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 250" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="ieBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF1F8"/>
      <stop offset="1" stop-color="#E3E9F6"/>
    </linearGradient>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
  </defs>

  <!-- Filebeat -->
  <rect x="40" y="96" width="210" height="104" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="145" y="158" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Filebeat</text>

  <!-- Container: Elasticsearch -->
  <rect x="360" y="20" width="760" height="212" rx="24" fill="url(#ieBg)" stroke="#D5DBEA"/>
  <text x="410" y="68" font-size="21" font-weight="600" letter-spacing="3" fill="#1B4FD8">ELASTICSEARCH</text>

  <!-- Ingest Pipeline (Akzent) -->
  <rect x="410" y="96" width="350" height="104" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="585" y="158" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ingest Pipeline</text>

  <!-- Index -->
  <rect x="860" y="96" width="200" height="104" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="960" y="158" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Index</text>

  <!-- Pfeile -->
  <line x1="254" y1="148" x2="352" y2="148" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="764" y1="148" x2="852" y2="148" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
</svg>
