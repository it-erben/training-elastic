<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 250" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
  </defs>

  <!-- Phasen-Beschriftungen -->
  <text x="145" y="50" font-size="21" font-weight="600" fill="#5B6675" text-anchor="middle">Sammeln</text>
  <text x="495" y="50" font-size="21" font-weight="600" fill="#5B6675" text-anchor="middle">Verarbeiten</text>
  <text x="885" y="50" font-size="21" font-weight="600" fill="#5B6675" text-anchor="middle">Speichern</text>
  <text x="1210" y="50" font-size="21" font-weight="600" fill="#5B6675" text-anchor="middle">Analysieren</text>

  <!-- Filebeat -->
  <rect x="40" y="80" width="210" height="120" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="145" y="150" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Filebeat</text>

  <!-- Logstash (Akzent) -->
  <rect x="350" y="80" width="290" height="120" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="495" y="132" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Logstash</text>
  <text x="495" y="170" font-size="21" fill="#DDE6FB" text-anchor="middle">input · filter · output</text>

  <!-- Elasticsearch -->
  <rect x="740" y="80" width="290" height="120" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="885" y="150" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Elasticsearch</text>

  <!-- Kibana -->
  <rect x="1130" y="80" width="160" height="120" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="1210" y="150" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Kibana</text>

  <!-- Pfeile mit Ports -->
  <line x1="254" y1="140" x2="342" y2="140" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <text x="298" y="238" font-size="20" fill="#5B6675" text-anchor="middle">5044</text>
  <line x1="644" y1="140" x2="732" y2="140" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <text x="688" y="238" font-size="20" fill="#5B6675" text-anchor="middle">9200</text>
  <line x1="1034" y1="140" x2="1122" y2="140" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <text x="1078" y="238" font-size="20" fill="#5B6675" text-anchor="middle">5601</text>
</svg>
