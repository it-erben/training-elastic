<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1430 480" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
    <marker id="ieArrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- Logquellen -->
  <rect x="30" y="40" width="320" height="104" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="190" y="102" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">apache-access.log</text>

  <rect x="30" y="190" width="320" height="104" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="190" y="252" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">java-app.log</text>

  <rect x="30" y="340" width="320" height="104" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="190" y="402" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">app-json.log</text>

  <!-- Filebeat -->
  <rect x="440" y="180" width="250" height="124" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="565" y="234" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Filebeat</text>
  <text x="565" y="272" font-size="21" fill="#5B6675" text-anchor="middle">logtype-Marker</text>

  <!-- Logstash (Akzent) -->
  <rect x="780" y="180" width="270" height="124" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="915" y="234" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Logstash</text>
  <text x="915" y="272" font-size="21" fill="#DDE6FB" text-anchor="middle">parsen, routen</text>

  <!-- Elasticsearch -->
  <rect x="1140" y="190" width="270" height="104" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="1275" y="252" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Elasticsearch</text>

  <!-- Quellen -> Filebeat -->
  <line x1="354" y1="92" x2="430" y2="216" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrowGray)"/>
  <line x1="354" y1="242" x2="430" y2="242" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrowGray)"/>
  <line x1="354" y1="392" x2="430" y2="268" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrowGray)"/>

  <!-- Filebeat -> Logstash -> Elasticsearch -->
  <line x1="694" y1="242" x2="772" y2="242" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="1054" y1="242" x2="1132" y2="242" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
</svg>
