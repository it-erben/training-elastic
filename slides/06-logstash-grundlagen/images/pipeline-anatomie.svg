<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="ieBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF1F8"/>
      <stop offset="1" stop-color="#E3E9F6"/>
    </linearGradient>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
    <marker id="ieArrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- Quellen -->
  <text x="130" y="187" font-size="21" font-weight="700" fill="#172033" text-anchor="end">Beats</text>
  <text x="130" y="229" font-size="21" font-weight="700" fill="#172033" text-anchor="end">TCP</text>
  <text x="130" y="271" font-size="21" font-weight="700" fill="#172033" text-anchor="end">Kafka</text>
  <line x1="145" y1="180" x2="210" y2="180" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrowGray)"/>
  <line x1="145" y1="222" x2="210" y2="222" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrowGray)"/>
  <line x1="145" y1="264" x2="210" y2="264" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrowGray)"/>

  <!-- Container: Logstash -->
  <rect x="220" y="40" width="880" height="340" rx="24" fill="url(#ieBg)" stroke="#D5DBEA"/>
  <text x="260" y="100" font-size="21" font-weight="600" letter-spacing="3" fill="#1B4FD8">LOGSTASH</text>

  <!-- Input -->
  <rect x="260" y="160" width="190" height="124" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="355" y="214" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Input</text>
  <text x="355" y="252" font-size="21" fill="#5B6675" text-anchor="middle">lesen</text>

  <!-- Filter (Akzent) -->
  <rect x="510" y="160" width="290" height="124" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="655" y="214" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Filter</text>
  <text x="655" y="252" font-size="21" fill="#DDE6FB" text-anchor="middle">transformieren</text>

  <!-- Output -->
  <rect x="860" y="160" width="200" height="124" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="960" y="214" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Output</text>
  <text x="960" y="252" font-size="21" fill="#5B6675" text-anchor="middle">schreiben</text>

  <!-- Pfeile innen -->
  <line x1="454" y1="222" x2="502" y2="222" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="804" y1="222" x2="852" y2="222" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <!-- Ziele -->
  <line x1="1110" y1="180" x2="1175" y2="180" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrowGray)"/>
  <line x1="1110" y1="222" x2="1175" y2="222" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrowGray)"/>
  <line x1="1110" y1="264" x2="1175" y2="264" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrowGray)"/>
  <text x="1190" y="187" font-size="21" font-weight="700" fill="#172033">Elasticsearch</text>
  <text x="1190" y="229" font-size="21" font-weight="700" fill="#172033">stdout</text>
  <text x="1190" y="271" font-size="21" font-weight="700" fill="#172033">Kafka, Datei, ...</text>
</svg>
