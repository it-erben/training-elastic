<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 292"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- axis labels -->
  <text x="70" y="70" fill="#5B6675" font-size="22" font-weight="400">Vergangenheit</text>
  <text x="930" y="70" text-anchor="end" fill="#5B6675" font-size="22" font-weight="400">jetzt</text>

  <!-- timeline axis -->
  <line x1="60" y1="120" x2="945" y2="120" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>

  <!-- time window (blue accent) -->
  <g filter="url(#ieShadow)">
    <rect x="330" y="85" width="340" height="70" rx="16" fill="#1B4FD8"/>
  </g>
  <text x="500" y="120" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="26" font-weight="700">Zeitfenster</text>

  <!-- boundary markers -->
  <line x1="330" y1="155" x2="330" y2="205" stroke="#D5DBEA" stroke-width="1.5"/>
  <line x1="670" y1="155" x2="670" y2="205" stroke="#D5DBEA" stroke-width="1.5"/>
  <text x="330" y="228" text-anchor="middle" fill="#172033" font-size="22" font-weight="700">von</text>
  <text x="670" y="228" text-anchor="middle" fill="#172033" font-size="22" font-weight="700">bis</text>

  <!-- caption -->
  <text x="500" y="270" text-anchor="middle" fill="#5B6675" font-size="20" font-weight="400">nur diese Treffer werden angezeigt</text>
</svg>
