<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- captions -->
  <text x="210" y="60" text-anchor="middle" fill="#5B6675" font-size="21" font-weight="600">Feld</text>
  <text x="485" y="60" text-anchor="middle" fill="#5B6675" font-size="21" font-weight="600">Operator</text>
  <text x="775" y="60" text-anchor="middle" fill="#5B6675" font-size="21" font-weight="600">Wert</text>

  <!-- Feld -->
  <g filter="url(#ieShadow)">
    <rect x="60" y="90" width="300" height="90" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/>
  </g>
  <text x="210" y="135" text-anchor="middle" dominant-baseline="middle" fill="#172033" font-size="26" font-weight="700">category</text>

  <line x1="370" y1="135" x2="425" y2="135" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>

  <!-- Operator -->
  <g filter="url(#ieShadow)">
    <rect x="435" y="90" width="100" height="90" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/>
  </g>
  <text x="485" y="135" text-anchor="middle" dominant-baseline="middle" fill="#172033" font-size="32" font-weight="700">:</text>

  <line x1="545" y1="135" x2="600" y2="135" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>

  <!-- Wert (blue accent) -->
  <g filter="url(#ieShadow)">
    <rect x="610" y="90" width="330" height="90" rx="16" fill="#1B4FD8"/>
  </g>
  <text x="775" y="135" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="25" font-weight="700">"Men's Clothing"</text>
</svg>
