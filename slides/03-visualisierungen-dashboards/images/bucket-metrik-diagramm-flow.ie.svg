<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 215"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- Rohdaten -->
  <g filter="url(#ieShadow)"><rect x="40" y="55" width="195" height="100" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="137" y="105" text-anchor="middle" dominant-baseline="middle" fill="#172033" font-size="25" font-weight="700">Rohdaten</text>

  <line x1="235" y1="105" x2="282" y2="105" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>

  <!-- Bucket -->
  <g filter="url(#ieShadow)"><rect x="282" y="55" width="195" height="100" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="379" y="93" text-anchor="middle" dominant-baseline="middle" fill="#172033" font-size="25" font-weight="700">Bucket</text>
  <text x="379" y="122" text-anchor="middle" dominant-baseline="middle" fill="#5B6675" font-size="18" font-weight="400">Terms: category</text>

  <line x1="477" y1="105" x2="524" y2="105" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>

  <!-- Metrik -->
  <g filter="url(#ieShadow)"><rect x="524" y="55" width="195" height="100" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="621" y="93" text-anchor="middle" dominant-baseline="middle" fill="#172033" font-size="25" font-weight="700">Metrik</text>
  <text x="621" y="122" text-anchor="middle" dominant-baseline="middle" fill="#5B6675" font-size="18" font-weight="400">Sum: price</text>

  <line x1="719" y1="105" x2="766" y2="105" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>

  <!-- Diagramm (Hero) -->
  <g filter="url(#ieShadow)"><rect x="766" y="55" width="195" height="100" rx="16" fill="#1B4FD8"/></g>
  <text x="863" y="93" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="25" font-weight="700">Diagramm</text>
  <text x="863" y="122" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" fill-opacity="0.85" font-size="18" font-weight="400">Balken je Kategorie</text>
</svg>
