<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="ieBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF1F8"/>
      <stop offset="1" stop-color="#E3E9F6"/>
    </linearGradient>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Netztrennung -->
  <line x1="600" y1="55" x2="600" y2="370" stroke="#5B6675" stroke-width="2.5" stroke-dasharray="10 10"/>
  <text x="600" y="32" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Netzwerk getrennt</text>

  <!-- linke Haelfte -->
  <rect x="20" y="55" width="500" height="315" rx="24" fill="url(#ieBg)" stroke="#D5DBEA"/>
  <rect x="145" y="110" width="250" height="110" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="270" y="175" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">es01</text>
  <text x="270" y="300" font-size="21" fill="#5B6675" text-anchor="middle">&#8222;Bin ich noch Master?&#8220;</text>

  <!-- rechte Haelfte -->
  <rect x="680" y="55" width="500" height="315" rx="24" fill="url(#ieBg)" stroke="#D5DBEA"/>
  <rect x="720" y="110" width="200" height="110" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="820" y="175" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">es02</text>
  <rect x="960" y="110" width="200" height="110" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="1060" y="175" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">es03</text>
  <text x="930" y="300" font-size="21" fill="#5B6675" text-anchor="middle">&#8222;Wählen wir einen neuen!&#8220;</text>
</svg>
