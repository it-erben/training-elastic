<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 525" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="ieBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF1F8"/>
      <stop offset="1" stop-color="#E3E9F6"/>
    </linearGradient>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrowGrau" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- Master -->
  <rect x="20" y="20" width="580" height="230" rx="24" fill="url(#ieBg)" stroke="#D5DBEA"/>
  <text x="55" y="70" font-size="21" font-weight="600" letter-spacing="3" fill="#1B4FD8">MASTER (KLEIN, DEDIZIERT)</text>
  <rect x="55" y="95" width="150" height="120" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="130" y="165" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">m-1</text>
  <rect x="225" y="95" width="150" height="120" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="300" y="165" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">m-2</text>
  <rect x="395" y="95" width="150" height="120" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="470" y="165" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">m-3</text>

  <!-- Coordinating -->
  <rect x="640" y="20" width="400" height="230" rx="24" fill="url(#ieBg)" stroke="#D5DBEA"/>
  <text x="675" y="70" font-size="21" font-weight="600" letter-spacing="3" fill="#1B4FD8">COORDINATING</text>
  <rect x="675" y="95" width="160" height="120" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="755" y="165" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">c-1</text>
  <rect x="855" y="95" width="160" height="120" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="935" y="165" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">c-2</text>

  <!-- Kibana, Apps -->
  <line x1="1078" y1="148" x2="1048" y2="148" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrowGrau)"/>
  <text x="1090" y="155" font-size="20" fill="#5B6675">Kibana, Apps</text>

  <!-- Hot Tier -->
  <rect x="20" y="280" width="580" height="230" rx="24" fill="url(#ieBg)" stroke="#D5DBEA"/>
  <text x="55" y="330" font-size="21" font-weight="600" letter-spacing="3" fill="#1B4FD8">HOT TIER (SSD, STARK)</text>
  <rect x="55" y="355" width="150" height="120" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="130" y="425" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">hot1</text>
  <rect x="225" y="355" width="150" height="120" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="300" y="425" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">hot2</text>
  <rect x="395" y="355" width="150" height="120" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="470" y="425" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">hot3</text>

  <!-- Warm Tier -->
  <rect x="640" y="280" width="400" height="230" rx="24" fill="url(#ieBg)" stroke="#D5DBEA"/>
  <text x="675" y="330" font-size="21" font-weight="600" letter-spacing="3" fill="#1B4FD8">WARM TIER (HDD, GROSS)</text>
  <rect x="675" y="355" width="160" height="120" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="755" y="425" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">warm1</text>
  <rect x="855" y="355" width="160" height="120" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="935" y="425" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">warm2</text>
</svg>
