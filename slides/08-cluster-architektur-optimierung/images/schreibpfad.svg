<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
    <marker id="ieArrowGrau" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="60" y="30" width="380" height="90" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="250" y="85" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Client</text>

  <line x1="250" y1="120" x2="250" y2="172" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <text x="272" y="153" font-size="20" fill="#5B6675">PUT kunden/_doc/42</text>

  <!-- Coordinating Node -->
  <rect x="60" y="180" width="380" height="110" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="250" y="227" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Coordinating Node</text>
  <text x="250" y="262" font-size="21" fill="#5B6675" text-anchor="middle">beliebiger Node</text>

  <line x1="250" y1="290" x2="250" y2="342" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <text x="272" y="323" font-size="20" fill="#5B6675">hash("42") % 3  &#8594;  Shard 1</text>

  <!-- Primary -->
  <rect x="60" y="350" width="380" height="150" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="250" y="400" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Primary P1</text>
  <text x="250" y="434" font-size="21" fill="#DDE6FB" text-anchor="middle">auf es02</text>
  <text x="250" y="464" font-size="21" fill="#DDE6FB" text-anchor="middle">1. indexiert lokal</text>

  <!-- Replica -->
  <rect x="820" y="365" width="360" height="120" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="1000" y="412" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Replica R1</text>
  <text x="1000" y="448" font-size="21" fill="#5B6675" text-anchor="middle">auf es01</text>

  <!-- Primary -> Replica -->
  <line x1="440" y1="395" x2="812" y2="395" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <text x="630" y="378" font-size="20" fill="#5B6675" text-anchor="middle">2. parallel an alle Replicas</text>

  <!-- Replica -> Primary (Bestaetigung) -->
  <line x1="820" y1="455" x2="448" y2="455" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrowGrau)"/>
  <text x="630" y="490" font-size="20" fill="#5B6675" text-anchor="middle">3. Bestätigung: Replicas melden Erfolg</text>

  <line x1="250" y1="500" x2="250" y2="552" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <!-- Antwort -->
  <rect x="60" y="560" width="380" height="110" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="250" y="606" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Antwort an den Client</text>
  <text x="250" y="642" font-size="21" fill="#5B6675" text-anchor="middle">4. erst jetzt: "created"</text>
</svg>
