<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 345" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="ieBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF1F8"/>
      <stop offset="1" stop-color="#E3E9F6"/>
    </linearGradient>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Node es01 -->
  <rect x="20" y="20" width="340" height="250" rx="24" fill="url(#ieBg)" stroke="#D5DBEA"/>
  <text x="55" y="72" font-size="21" font-weight="600" letter-spacing="3" fill="#1B4FD8">ES01</text>
  <rect x="55" y="100" width="130" height="130" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="120" y="160" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">P0</text>
  <text x="120" y="194" font-size="21" fill="#DDE6FB" text-anchor="middle">Primary</text>
  <rect x="205" y="100" width="130" height="130" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="270" y="160" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">R1</text>
  <text x="270" y="194" font-size="21" fill="#5B6675" text-anchor="middle">Replica</text>

  <!-- Node es02 -->
  <rect x="410" y="20" width="340" height="250" rx="24" fill="url(#ieBg)" stroke="#D5DBEA"/>
  <text x="445" y="72" font-size="21" font-weight="600" letter-spacing="3" fill="#1B4FD8">ES02</text>
  <rect x="445" y="100" width="130" height="130" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="510" y="160" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">P1</text>
  <text x="510" y="194" font-size="21" fill="#DDE6FB" text-anchor="middle">Primary</text>
  <rect x="595" y="100" width="130" height="130" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="660" y="160" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">R2</text>
  <text x="660" y="194" font-size="21" fill="#5B6675" text-anchor="middle">Replica</text>

  <!-- Node es03 -->
  <rect x="800" y="20" width="340" height="250" rx="24" fill="url(#ieBg)" stroke="#D5DBEA"/>
  <text x="835" y="72" font-size="21" font-weight="600" letter-spacing="3" fill="#1B4FD8">ES03</text>
  <rect x="835" y="100" width="130" height="130" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="900" y="160" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">P2</text>
  <text x="900" y="194" font-size="21" fill="#DDE6FB" text-anchor="middle">Primary</text>
  <rect x="985" y="100" width="130" height="130" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="1050" y="160" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">R0</text>
  <text x="1050" y="194" font-size="21" fill="#5B6675" text-anchor="middle">Replica</text>

  <!-- Legende -->
  <rect x="348" y="298" width="22" height="22" rx="6" fill="#1B4FD8"/>
  <text x="382" y="316" font-size="20" fill="#5B6675"><tspan font-weight="700" fill="#172033">P</tspan> = Primary Shard</text>
  <rect x="612" y="298" width="22" height="22" rx="6" fill="#FFFFFF" stroke="#D5DBEA"/>
  <text x="646" y="316" font-size="20" fill="#5B6675"><tspan font-weight="700" fill="#172033">R</tspan> = Replica Shard</text>
</svg>
