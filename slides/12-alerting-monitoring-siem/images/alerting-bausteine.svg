<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1410 530" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="ieBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF1F8"/>
      <stop offset="1" stop-color="#E3E9F6"/>
    </linearGradient>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
  </defs>

  <!-- Container: die Rule -->
  <rect x="40" y="40" width="1330" height="450" rx="24" fill="url(#ieBg)" stroke="#D5DBEA"/>
  <text x="110" y="102" font-size="21" font-weight="600" letter-spacing="3" fill="#1B4FD8">RULE (REGEL)</text>

  <!-- Query -->
  <rect x="90" y="140" width="290" height="150" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="235" y="195" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Query</text>
  <text x="235" y="230" font-size="21" fill="#5B6675" text-anchor="middle">Welche Daten?</text>
  <text x="235" y="260" font-size="21" fill="#5B6675" text-anchor="middle">(Index, KQL/DSL)</text>

  <!-- Condition -->
  <rect x="404" y="140" width="290" height="150" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="549" y="195" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Condition</text>
  <text x="549" y="230" font-size="21" fill="#5B6675" text-anchor="middle">Wann feuern?</text>
  <text x="549" y="260" font-size="21" fill="#5B6675" text-anchor="middle">(Schwellwert, Fenster)</text>

  <!-- Schedule -->
  <rect x="718" y="140" width="290" height="150" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="863" y="195" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Schedule</text>
  <text x="863" y="230" font-size="21" fill="#5B6675" text-anchor="middle">Wie oft prüfen?</text>
  <text x="863" y="260" font-size="21" fill="#5B6675" text-anchor="middle">(z. B. jede Minute)</text>

  <!-- Action -->
  <rect x="1032" y="140" width="290" height="150" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="1177" y="195" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Action</text>
  <text x="1177" y="230" font-size="21" fill="#5B6675" text-anchor="middle">Was tun,</text>
  <text x="1177" y="260" font-size="21" fill="#5B6675" text-anchor="middle">wenn es feuert?</text>

  <!-- Pfeil Action -> Connector -->
  <line x1="1150" y1="290" x2="1150" y2="332" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <!-- Connector (Akzent) -->
  <rect x="960" y="340" width="380" height="110" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="1150" y="387" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Connector</text>
  <text x="1150" y="422" font-size="21" fill="#DDE6FB" text-anchor="middle">Wohin? (Index, Log, Slack ...)</text>
</svg>
