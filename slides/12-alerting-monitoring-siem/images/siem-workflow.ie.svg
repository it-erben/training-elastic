<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- Detection Rule -->
  <g filter="url(#ieShadow)"><rect x="30" y="60" width="200" height="80" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="130" y="100" text-anchor="middle" dominant-baseline="middle" fill="#172033" font-size="22" font-weight="700">Detection Rule</text>

  <line x1="230" y1="100" x2="268" y2="100" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>

  <!-- Security-Alert (Severity: gedeckter Amber-Akzent) -->
  <g filter="url(#ieShadow)"><rect x="276" y="60" width="200" height="80" rx="16" fill="#C7912E"/></g>
  <text x="376" y="100" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="22" font-weight="700">Security-Alert</text>

  <line x1="476" y1="100" x2="514" y2="100" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>

  <!-- Timeline -->
  <g filter="url(#ieShadow)"><rect x="522" y="60" width="200" height="80" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="622" y="100" text-anchor="middle" dominant-baseline="middle" fill="#172033" font-size="22" font-weight="700">Timeline</text>

  <line x1="722" y1="100" x2="760" y2="100" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>

  <!-- Case (Kernelement: blau) -->
  <g filter="url(#ieShadow)"><rect x="768" y="60" width="200" height="80" rx="16" fill="#1B4FD8"/></g>
  <text x="868" y="100" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="22" font-weight="700">Case</text>
</svg>
