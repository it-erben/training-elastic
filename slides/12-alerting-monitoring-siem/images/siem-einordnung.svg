<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
  </defs>

  <!-- Analytics -->
  <rect x="60" y="20" width="390" height="130" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="255" y="75" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Analytics</text>
  <text x="255" y="110" font-size="21" fill="#5B6675" text-anchor="middle">Discover, Dashboards</text>

  <!-- Security -->
  <rect x="550" y="20" width="390" height="130" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="745" y="75" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Security</text>
  <text x="745" y="110" font-size="21" fill="#5B6675" text-anchor="middle">SIEM-App</text>

  <line x1="255" y1="150" x2="255" y2="192" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="745" y1="150" x2="745" y2="192" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <!-- Gemeinsame Datenbasis (Akzent) -->
  <rect x="60" y="200" width="880" height="150" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="500" y="265" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Dieselben Elasticsearch-Indizes</text>
  <text x="500" y="305" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">und Datenströme</text>
</svg>
