<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- Quellen (fan-in) -->
  <g filter="url(#ieShadow)"><rect x="40" y="40" width="180" height="56" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="130" y="68" text-anchor="middle" dominant-baseline="middle" fill="#172033" font-size="20" font-weight="700">Elasticsearch</text>

  <g filter="url(#ieShadow)"><rect x="40" y="132" width="180" height="56" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="130" y="160" text-anchor="middle" dominant-baseline="middle" fill="#172033" font-size="20" font-weight="700">Kibana</text>

  <g filter="url(#ieShadow)"><rect x="40" y="224" width="180" height="56" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="130" y="252" text-anchor="middle" dominant-baseline="middle" fill="#172033" font-size="20" font-weight="700">Logstash</text>

  <!-- Fan-in Pfeile -->
  <line x1="220" y1="68" x2="289.0" y2="140.6" stroke="#5B6675" stroke-width="2.5"/>
  <path d="M284.0,145.4 L294.1,135.8 L298,150 z" fill="#5B6675"/>
  <line x1="220" y1="160" x2="298" y2="160" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>
  <line x1="220" y1="252" x2="289.0" y2="179.4" stroke="#5B6675" stroke-width="2.5"/>
  <path d="M294.1,184.2 L284.0,174.6 L298,170 z" fill="#5B6675"/>

  <!-- Collector -->
  <g filter="url(#ieShadow)"><rect x="308" y="105" width="190" height="110" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="403" y="148" text-anchor="middle" dominant-baseline="middle" fill="#172033" font-size="22" font-weight="700">Elastic Agent /</text>
  <text x="403" y="176" text-anchor="middle" dominant-baseline="middle" fill="#172033" font-size="22" font-weight="700">Metricbeat</text>

  <line x1="498" y1="160" x2="536" y2="160" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>

  <!-- Monitoring-Indizes -->
  <g filter="url(#ieShadow)"><rect x="546" y="120" width="190" height="80" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="641" y="150" text-anchor="middle" dominant-baseline="middle" fill="#172033" font-size="22" font-weight="700">Monitoring-</text>
  <text x="641" y="176" text-anchor="middle" dominant-baseline="middle" fill="#172033" font-size="22" font-weight="700">Indizes</text>

  <line x1="736" y1="160" x2="774" y2="160" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrow)"/>

  <!-- Ziel: Kibana Stack Monitoring (blau) -->
  <g filter="url(#ieShadow)"><rect x="784" y="120" width="190" height="80" rx="16" fill="#1B4FD8"/></g>
  <text x="879" y="150" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="22" font-weight="700">Kibana:</text>
  <text x="879" y="176" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="19" font-weight="700">Stack Monitoring</text>
</svg>
