<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 280" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
    <marker id="ieArrowGrau" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- OK -->
  <rect x="20" y="40" width="220" height="110" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="130" y="106" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">OK</text>

  <text x="351" y="72" font-size="20" fill="#5B6675" text-anchor="middle">Bedingung erfüllt</text>
  <line x1="248" y1="95" x2="462" y2="95" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <!-- Active (Akzent) -->
  <rect x="470" y="40" width="240" height="110" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="590" y="106" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Active</text>

  <text x="871" y="72" font-size="20" fill="#5B6675" text-anchor="middle">Bedingung nicht mehr erfüllt</text>
  <line x1="718" y1="95" x2="1032" y2="95" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>

  <!-- Recovered -->
  <rect x="1040" y="40" width="260" height="110" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="1170" y="106" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Recovered</text>

  <!-- Schleife: bleibt Active, solange Bedingung erfüllt -->
  <path d="M 540 150 L 540 190 Q 540 210 560 210 L 620 210 Q 640 210 640 190 L 640 160" fill="none" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrowGrau)"/>
  <text x="590" y="254" font-size="20" fill="#5B6675" text-anchor="middle">bei jedem Check erneut geprüft</text>
</svg>
