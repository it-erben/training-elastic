<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- Zentrale (Akzent-Box, blau) -->
  <g filter="url(#ieShadow)"><rect x="380" y="36" width="240" height="80" rx="16" fill="#1B4FD8"/></g>
  <text x="500" y="76" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="26" font-weight="700">Fleet (Kibana)</text>
  <text x="650" y="76" dominant-baseline="middle" fill="#5B6675" font-size="20">du änderst hier eine Policy</text>

  <!-- Verteilung -->
  <line x1="500" y1="116" x2="500.0" y2="183.0" stroke="#5B6675" stroke-width="2.5"/>
  <path d="M493.0,183.0 L507.0,183.0 L500,196 z" fill="#5B6675"/>
  <text x="520" y="160" dominant-baseline="middle" fill="#5B6675" font-size="20">verteilt an</text>

  <!-- Fan-out zu vielen Agents -->
  <line x1="500" y1="200" x2="157.7" y2="281.0" stroke="#5B6675" stroke-width="2.5"/>
  <path d="M156.0,274.2 L159.3,287.8 L145,284 z" fill="#5B6675"/>
  <line x1="500" y1="200" x2="376.0" y2="277.1" stroke="#5B6675" stroke-width="2.5"/>
  <path d="M372.3,271.2 L379.7,283.1 L365,284 z" fill="#5B6675"/>
  <line x1="500" y1="200" x2="575.8" y2="274.9" stroke="#5B6675" stroke-width="2.5"/>
  <path d="M570.8,279.8 L580.7,269.9 L585,284 z" fill="#5B6675"/>
  <line x1="500" y1="200" x2="792.5" y2="280.5" stroke="#5B6675" stroke-width="2.5"/>
  <path d="M790.6,287.3 L794.3,273.8 L805,284 z" fill="#5B6675"/>

  <g filter="url(#ieShadow)"><rect x="70" y="290" width="150" height="70" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="145" y="325" text-anchor="middle" dominant-baseline="middle" fill="#172033" font-size="24" font-weight="700">Agent</text>

  <g filter="url(#ieShadow)"><rect x="290" y="290" width="150" height="70" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="365" y="325" text-anchor="middle" dominant-baseline="middle" fill="#172033" font-size="24" font-weight="700">Agent</text>

  <g filter="url(#ieShadow)"><rect x="510" y="290" width="150" height="70" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="585" y="325" text-anchor="middle" dominant-baseline="middle" fill="#172033" font-size="24" font-weight="700">Agent</text>

  <g filter="url(#ieShadow)"><rect x="730" y="290" width="150" height="70" rx="16" fill="#FFFFFF" stroke="#D5DBEA" stroke-width="1.5"/></g>
  <text x="805" y="325" text-anchor="middle" dominant-baseline="middle" fill="#172033" font-size="24" font-weight="700">Agent</text>

  <text x="895" y="325" dominant-baseline="middle" fill="#5B6675" font-size="20">... viele Hosts</text>
</svg>
