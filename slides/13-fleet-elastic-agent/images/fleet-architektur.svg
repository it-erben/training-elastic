<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 760" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
    <marker id="ieArrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- Legende oben rechts -->
  <line x1="820" y1="95" x2="884" y2="95" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrowGray)"/>
  <text x="904" y="102" font-size="20" fill="#5B6675">Kontrollkanal (Steuerung)</text>
  <line x1="820" y1="140" x2="884" y2="140" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <text x="904" y="147" font-size="20" fill="#5B6675">Datenpfad (Nutzdaten)</text>

  <!-- Kibana (Fleet-UI) -->
  <rect x="80" y="70" width="400" height="140" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="280" y="130" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Kibana (Fleet-UI)</text>
  <text x="280" y="165" font-size="21" fill="#5B6675" text-anchor="middle">Management → Fleet</text>

  <!-- Annotation zu Kibana -->
  <text x="520" y="125" font-size="20" fill="#5B6675">Policies definieren,</text>
  <text x="520" y="155" font-size="20" fill="#5B6675">Agent-Status einsehen</text>

  <!-- Elasticsearch (Akzent) -->
  <rect x="80" y="330" width="400" height="110" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="280" y="396" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Elasticsearch</text>

  <!-- Fleet Server -->
  <rect x="80" y="560" width="400" height="140" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="280" y="620" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Fleet Server</text>
  <text x="280" y="655" font-size="21" fill="#5B6675" text-anchor="middle">Port 8220</text>

  <!-- Elastic Agents -->
  <rect x="780" y="560" width="400" height="140" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="980" y="620" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Elastic Agents</text>
  <text x="980" y="655" font-size="21" fill="#5B6675" text-anchor="middle">auf den Hosts</text>

  <!-- Kontrollkanal: Kibana -> Elasticsearch -->
  <line x1="280" y1="210" x2="280" y2="322" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrowGray)"/>
  <text x="302" y="273" font-size="20" fill="#5B6675">liest/schreibt Policies</text>

  <!-- Kontrollkanal: Elasticsearch -> Fleet Server -->
  <line x1="280" y1="440" x2="280" y2="552" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrowGray)"/>
  <text x="302" y="503" font-size="20" fill="#5B6675">Policies</text>

  <!-- Kontrollkanal: Fleet Server <-> Agents -->
  <line x1="492" y1="630" x2="768" y2="630" stroke="#5B6675" stroke-width="2.5" marker-start="url(#ieArrowGray)" marker-end="url(#ieArrowGray)"/>
  <text x="630" y="605" font-size="20" fill="#5B6675" text-anchor="middle">Checkin &amp; Policies</text>

  <!-- Datenpfad: Agents -> Elasticsearch -->
  <path d="M 980 552 L 980 409 Q 980 385 956 385 L 496 385" fill="none" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <text x="730" y="360" font-size="20" font-weight="600" fill="#1B4FD8" text-anchor="middle">Daten (Logs, Metriken, ...)</text>
</svg>
