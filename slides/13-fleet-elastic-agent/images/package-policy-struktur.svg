<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 510" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="ieBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF1F8"/>
      <stop offset="1" stop-color="#E3E9F6"/>
    </linearGradient>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
  </defs>

  <!-- Container: Agent Policy -->
  <rect x="40" y="30" width="1000" height="450" rx="24" fill="url(#ieBg)" stroke="#D5DBEA"/>
  <text x="110" y="90" font-size="21" font-weight="600" letter-spacing="3" fill="#1B4FD8">AGENT POLICY "AGENT POLICY TRAINING"</text>

  <!-- Package Policy (Akzent) -->
  <rect x="290" y="120" width="500" height="120" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="540" y="171" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Package Policy "system-1"</text>
  <text x="540" y="206" font-size="21" fill="#DDE6FB" text-anchor="middle">Integration: System</text>

  <!-- Verbindungen -->
  <path d="M 540 240 L 540 285 L 290 285 L 290 312" fill="none" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrowGray)"/>
  <path d="M 540 240 L 540 285 L 750 285 L 750 312" fill="none" stroke="#5B6675" stroke-width="2.5" marker-end="url(#ieArrowGray)"/>

  <!-- Logs -->
  <rect x="110" y="320" width="360" height="110" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="290" y="367" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Logs</text>
  <text x="290" y="402" font-size="21" fill="#5B6675" text-anchor="middle">syslog, auth</text>

  <!-- Metriken -->
  <rect x="530" y="320" width="440" height="110" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="750" y="367" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">Metriken</text>
  <text x="750" y="402" font-size="21" fill="#5B6675" text-anchor="middle">cpu, memory, network, filesystem, ...</text>
</svg>
