<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 460" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="ieArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/>
    </marker>
  </defs>

  <!-- Schritt 1 -->
  <rect x="40" y="30" width="540" height="170" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="310" y="96" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">1. Admin erstellt Policy</text>
  <text x="310" y="132" font-size="21" fill="#5B6675" text-anchor="middle">Fleet erzeugt Enrollment-Token</text>

  <!-- Schritt 2 -->
  <rect x="660" y="30" width="540" height="170" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="930" y="82" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">2. Agent installieren</text>
  <text x="930" y="120" font-size="18" fill="#5B6675" text-anchor="middle" font-family="'SF Mono', Menlo, monospace">elastic-agent install \</text>
  <text x="930" y="147" font-size="18" fill="#5B6675" text-anchor="middle" font-family="'SF Mono', Menlo, monospace">--url=https://fleet-server:8220 \</text>
  <text x="930" y="174" font-size="18" fill="#5B6675" text-anchor="middle" font-family="'SF Mono', Menlo, monospace">--enrollment-token=&lt;TOKEN&gt;</text>

  <!-- Schritt 3 -->
  <rect x="40" y="260" width="540" height="170" rx="18" fill="#FFFFFF" stroke="#D5DBEA" filter="url(#ieShadow)"/>
  <text x="310" y="326" font-size="30" font-weight="700" fill="#172033" text-anchor="middle">3. Fleet Server prüft Token</text>
  <text x="310" y="362" font-size="21" fill="#5B6675" text-anchor="middle">Agent erhält eigenen API-Key</text>

  <!-- Schritt 4 (Akzent) -->
  <rect x="660" y="260" width="540" height="170" rx="18" fill="#1B4FD8" filter="url(#ieShadow)"/>
  <text x="930" y="326" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">4. Agent lädt seine Policy</text>
  <text x="930" y="362" font-size="21" fill="#DDE6FB" text-anchor="middle">und beginnt zu sammeln</text>

  <!-- Flusspfeile -->
  <line x1="584" y1="115" x2="650" y2="115" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <path d="M 930 204 L 930 232 L 310 232 L 310 252" fill="none" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
  <line x1="584" y1="345" x2="650" y2="345" stroke="#1B4FD8" stroke-width="3" marker-end="url(#ieArrow)"/>
</svg>
