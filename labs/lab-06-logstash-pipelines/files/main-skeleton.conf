input {
  beats {
    port => 5044
  }
}

filter {
  # Nur Java-Logs parsen (Marker aus Filebeat, Lab 05)
  if [___] == "___" {

    # Teil 2, Schritt 2.1: Logzeile in Felder zerlegen
    # (Muster wird vorgegeben -- Erklärung folgt in Modul 07)
    grok {
      match => {
        "message" => "(?m)%{TIMESTAMP_ISO8601:log_ts} %{LOGLEVEL:level} \[%{DATA:thread}\] %{JAVACLASS:logger} - %{GREEDYDATA:msg}"
      }
    }

    # Teil 2, Schritt 2.3: @timestamp aus der Logzeile setzen
    # Beispielwert: 2026-06-30 12:01:23,189
    date {
      match => ["___", "yyyy-MM-dd HH:mm:ss,SSS"]
      timezone => "UTC"
    }

    # Teil 3, Schritt 3.1: ERROR-Events mit dem Tag "fehler" markieren
    if [___] == "___" {
      mutate {
        add_tag => ["___"]
      }
    }

    # Teil 3, Schritt 3.1: Hilfsfeld log_ts entfernen
    mutate {
      remove_field => ["___"]
    }
  }
}

output {
  # Teil 3, Schritt 3.2: Java-Logs in den Index "javalogs",
  # alle anderen Events weiter auf die Konsole
  if [___] == "___" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "___"
    }
  } else {
    stdout {
      codec => rubydebug
    }
  }
}
