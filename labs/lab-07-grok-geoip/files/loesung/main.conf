# Musterlösung Lab 07 (Endzustand):
# Apache-Logs grokken, Geoip anreichern, alle drei Logtypen nach
# Elasticsearch routen.

input {
  beats {
    port => 5044
  }
}

filter {
  if [logtype] == "apache" {
    # Teil 1: Combined Log Format mit fertigem Pattern parsen
    grok {
      match => { "message" => "%{HTTPD_COMBINEDLOG}" }
    }

    # Timestamp aus der Logzeile übernehmen
    date {
      match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
      remove_field => ["timestamp"]
    }

    # Teil 3: Geoip-Anreicherung der Client-IP
    geoip {
      source => "[source][address]"
      target => "[source]"
    }

    # User-Agent-String aufschlüsseln (Browser, OS, Gerät)
    useragent {
      source => "[user_agent][original]"
      target => "[user_agent]"
    }
  }

  if [logtype] == "java" {
    grok {
      match => {
        "message" => "(?m)%{TIMESTAMP_ISO8601:log_ts} %{LOGLEVEL:level} \[%{DATA:thread}\] %{JAVACLASS:logger} - %{GREEDYDATA:msg}"
      }
    }
    date {
      match => ["log_ts", "yyyy-MM-dd HH:mm:ss,SSS"]
      timezone => "UTC"
    }
    if [level] == "ERROR" {
      mutate {
        add_tag => ["fehler"]
      }
    }
    mutate {
      remove_field => ["log_ts"]
    }
  }

  # JSON-Logs (logtype "app") sind schon strukturiert -- kein Filter nötig
}

output {
  if [logtype] == "apache" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "weblogs"
    }
  } else if [logtype] == "java" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "javalogs"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "applogs"
    }
  }
}
