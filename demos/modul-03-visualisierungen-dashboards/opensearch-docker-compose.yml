# ============================================
# OpenSearch Vergleichs-Demo
# ============================================
# Separate OpenSearch-Instanz für einen kurzen
# Vergleich zwischen Kibana und OpenSearch
# Dashboards.
#
# Läuft auf anderen Ports (9201 / 5602), damit
# sie parallel zur Elasticsearch/Kibana-Instanz
# betrieben werden kann.
#
# Starten:   docker compose -f opensearch-docker-compose.yml up -d
# Stoppen:   docker compose -f opensearch-docker-compose.yml down
# Logs:      docker compose -f opensearch-docker-compose.yml logs -f
# Reset:     docker compose -f opensearch-docker-compose.yml down -v

services:
  # ------------------------------------------
  # OpenSearch 2.18.0 (Single-Node)
  # ------------------------------------------
  # OpenSearch ist der Open-Source-Fork von
  # Elasticsearch (seit 2021, von AWS initiiert).
  # Security ist für die Demo deaktiviert.
  demo-opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: demo-opensearch
    environment:
      # Single-Node-Modus
      discovery.type: single-node
      # Security-Plugin deaktivieren (nur Demo!)
      DISABLE_SECURITY_PLUGIN: "true"
      # JVM Heap Size
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      # Cluster-Name
      cluster.name: opensearch-demo
    ports:
      - "9201:9200"
    volumes:
      - demo_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - demo-opensearch-network

  # ------------------------------------------
  # OpenSearch Dashboards 2.18.0
  # ------------------------------------------
  # OpenSearch Dashboards ist der Fork von
  # Kibana. Die Oberfläche sieht ähnlich aus,
  # hat aber einige Unterschiede in der
  # Funktionalität und im Branding.
  demo-opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.18.0
    container_name: demo-opensearch-dashboards
    environment:
      # Verbindung zu OpenSearch
      OPENSEARCH_HOSTS: '["http://demo-opensearch:9200"]'
      # Security-Plugin deaktivieren (nur Demo!)
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5602:5601"
    depends_on:
      demo-opensearch:
        condition: service_healthy
    networks:
      - demo-opensearch-network

volumes:
  demo_opensearch_data:
    name: demo-opensearch-data

networks:
  demo-opensearch-network:
    name: demo-opensearch-network
