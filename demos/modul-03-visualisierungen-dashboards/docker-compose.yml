# ============================================
# Elastic Stack Demo - Modul 03:
#   Visualisierungen & Dashboards
# ============================================
# Diese Datei ist identisch mit der
# docker-compose.yml aus Modul 01.
#
# Im Normalfall läuft die zentrale Instanz
# aus Modul 01 bereits. Diese Datei dient
# nur als Fallback, falls die Instanz
# zwischenzeitlich gestoppt wurde.
#
# Starten:   docker compose up -d
# Stoppen:   docker compose down
# Logs:      docker compose logs -f demo-kibana
# Reset:     docker compose down -v && docker compose up -d

services:
  # ------------------------------------------
  # Elasticsearch 8.17.0 (Single-Node)
  # ------------------------------------------
  demo-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: demo-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
      cluster.name: schulung-cluster
    ports:
      - "9200:9200"
    volumes:
      - demo_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - demo-network

  # ------------------------------------------
  # Kibana 8.17.0
  # ------------------------------------------
  demo-kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: demo-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://demo-elasticsearch:9200
      TELEMETRY_ENABLED: "false"
    ports:
      - "5601:5601"
    depends_on:
      demo-elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s
    networks:
      - demo-network

  # ------------------------------------------
  # Einmalig: Sample eCommerce Daten laden
  # ------------------------------------------
  demo-setup:
    image: curlimages/curl:8.18.0
    container_name: demo-setup
    depends_on:
      demo-kibana:
        condition: service_healthy
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Lade eCommerce-Beispieldaten..."
        curl -sf -X POST \
          http://demo-kibana:5601/api/sample_data/ecommerce \
          -H "kbn-xsrf: true" \
          -H "Content-Type: application/json"
        echo ""
        echo "Beispieldaten erfolgreich geladen."
    networks:
      - demo-network

volumes:
  demo_es_data:
    name: demo-es-data

networks:
  demo-network:
    name: demo-network
